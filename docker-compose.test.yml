services:
  frontend-test:
    build:
      context: ./frontend
      target: ${DOCKER_TARGET:-development}
    command: npm run test
    environment:
      - NODE_ENV=test
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules

# Keep the below uncommented to prevent warning when running tests while dev containers are up
  new_kicks_fe:
    profiles:
      - dev
  new_kicks_api:
    profiles:
      - dev
  db:
    profiles:
      - dev

volumes:
  node_modules: